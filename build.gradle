plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Registrate"
        url = "https://maven.ithundxr.dev/snapshots"
    }
    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net"
    }
}

configurations {
    shaderpacks {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version


    runs {
        client {
            client()

            systemProperty 'neoforge.disableGlValidation', 'true'
        }

        client2 {
            client()
            gameDirectory = project.file('run')
            programArguments = ['--username', 'SShakusora']
            systemProperty 'neoforge.disableGlValidation', 'true'
        }

        structureEditor {
            client()
            gameDirectory = project.file('run')
            programArguments = ['--quickPlaySingleplayer', 'sap_structure_editor_1_21_1']
            systemProperty 'shadowsandpetals.structureEditor', 'true'
        }

        server {
            server()
        }

        data {
            data()


            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.register('prepareStructureEditorWorld', JavaExec) {
    group = 'shadowsandpetals'
    description = 'Creates or refreshes the void structure-editor world and links its structure directory to src/main/resources.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.sshakusora.shadowsandpetals.dev.StructureEditorWorldBootstrap'
    workingDir = file('run')
    args file('run').absolutePath,
            file('src/main/resources/data/shadowsandpetals/structure').absolutePath
}

tasks.named('runStructureEditor') {
    dependsOn tasks.named('prepareStructureEditorWorld')
}

tasks.register('installClientShaderpacks', Copy) {
    group = 'shadowsandpetals'
    description = 'Installs shader packs into the main client run directory.'
    from configurations.shaderpacks
    into layout.projectDirectory.dir('run/shaderpacks')
}

tasks.register('installShaderpacks') {
    group = 'shadowsandpetals'
    description = 'Installs development shader packs into the shared client run directory.'
    dependsOn tasks.named('installClientShaderpacks')
}

tasks.register('cleanRunLogs', Delete) {
    group = 'shadowsandpetals'
    description = 'Deletes logs and crash reports from the shared client run directory.'
    delete layout.projectDirectory.dir('run/logs'), layout.projectDirectory.dir('run/crash-reports')
}

tasks.named('runClient') {
    dependsOn tasks.named('installClientShaderpacks')
}

tasks.named('runClient2') {
    dependsOn tasks.named('installClientShaderpacks')
}

tasks.named('runStructureEditor') {
    dependsOn tasks.named('installClientShaderpacks')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Create
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    // JEI
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.21.0.247"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.21.0.247"

    // Jade
    implementation "maven.modrinth:jade:15.10.5+neoforge"

    // Serene Seasons compatibility runtime
    runtimeOnly "com.github.glitchfiend:SereneSeasons-neoforge:1.21.1-10.1.0.9"

    runtimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    runtimeOnly "maven.modrinth:iris:1.8.12+1.21.1-neoforge"

    // Shader packs for visual compatibility testing
    shaderpacks "maven.modrinth:complementary-reimagined:r5.8.1@zip"
    shaderpacks "maven.modrinth:complementary-unbound:r5.8.1@zip"
    shaderpacks "maven.modrinth:bsl-shaders:10.1.3@zip"
    shaderpacks "maven.modrinth:photon-shader:v1.3b@zip"
    shaderpacks "maven.modrinth:makeup-ultra-fast-shaders:9.5c@zip"

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             create_version_range  : create_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
